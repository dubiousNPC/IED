settings_modName: "Dubious Equipment Display"
settings_modDesc: "Shows carried weapons, shields and ammunition on the body, using the same sheath bones as OpenMW's own weapon sheathing."

settings_general: "General"

setting_shownpcs: "NPCs display carried gear"
setting_shownpcs_desc: "Show carried weapons and shields on other actors. Turning this off strips them immediately; your own gear is unaffected. Each weapon category also has its own NPCs checkbox, under Weapons."

setting_npcrange: "NPC display range"
setting_npcrange_desc: "NPCs further than this from you (in game units; one exterior cell is 8192) do not display carried gear, and cost only an occasional distance check. NPCs slightly beyond the range keep their gear until they move well past it, so nothing flickers at the edge.\n\n0 means no limit."

setting_pollinterval: "Update interval (seconds)"
setting_pollinterval_desc: "How often to check whether your carried gear changed. NPCs check at twice this interval. The check does no record or file lookups and allocates nothing when nothing changed, so raising this saves little."

settings_weapons: "Weapons"
settings_weapons_desc: "One row per weapon category.\n\nShow: display carried weapons of this category at all.\n\nSecondary set: add a second slot on the Ded bones, so two different weapons of the category can show.\n\nAlternate: move the first slot from the standard sheath bone to the Alt bone. A skeleton without the Alt bone falls back to the standard one.\n\nNPCs: also show this category on NPCs. Has no effect unless NPCs display carried gear is on.\n\nA category only offers the options it has bones for."

# Checkbox labels (multiCheckbox keys)
enabled: "Show"
secondary: "Secondary set"
alternate: "Alternate"
npc: "NPCs"

cat_shortBlade: "Short blades"
cat_shortBlade_desc: "Daggers, tantos, short swords."
cat_longBlade: "Long blades"
cat_longBlade_desc: "One-handed swords, sabres, katanas."
cat_longBladeTwoHand: "Two-handed blades"
cat_longBladeTwoHand_desc: "Claymores, dai-katanas."
cat_axe: "Axes"
cat_axe_desc: "One-handed axes. On the standard layer they share the long blade bone, so a carried axe and a carried long blade cannot both show there."
cat_axeTwoHand: "Two-handed axes"
cat_axeTwoHand_desc: "Battle axes."
cat_blunt: "Blunt weapons"
cat_blunt_desc: "Clubs, maces, one-handed hammers."
cat_bluntTwoClose: "Two-handed hammers"
cat_bluntTwoClose_desc: "Warhammers."
cat_bluntTwoWide: "Staves"
cat_bluntTwoWide_desc: "Staves and other wide two-handed blunt weapons."
cat_spear: "Spears"
cat_spear_desc: "Spears and halberds. There is no Ded spear bone, so spears have no secondary set."
cat_bow: "Bows"
cat_bow_desc: "Long bows and short bows."
cat_crossbow: "Crossbows"
cat_crossbow_desc: "Crossbows."
cat_thrown: "Thrown weapons"
cat_thrown_desc: "Darts, throwing knives and stars."
cat_quiver: "Quiver"
cat_quiver_desc: "Equipped arrows or bolts, shown while you carry the matching bow or crossbow. Needs a skeleton with numbered ammo bones. There is no Ded or Alt quiver bone."
cat_shield: "Shields"
cat_shield_desc: "A carried, unequipped shield. Secondary adds a second shield on the Ded bone, which is also used while an equipped shield is sheathed on the standard bone. There is no Alt shield bone."
