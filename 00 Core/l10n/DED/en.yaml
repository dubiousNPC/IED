settings_npcs: "NPC filters"
settings_npcs_desc: "Which NPCs display carried gear. Only affects NPCs; your own gear is never filtered. Changes apply within a second or two, and immediately to NPCs entering a cell."

setting_classgroups: "Blacklist class groups"
setting_classgroups_desc: "NPCs of any class in a ticked group show no carried gear, unless they belong to a whitelisted faction. Some classes sit in more than one group (healer service, scout, smith, warrior); ticking either group hides them."
setting_classids: "Blacklist class IDs"
setting_classids_desc: "Extra class IDs to blacklist, one per entry, e.g. \"guard\" or \"t_glb_noble\". Type the ID and press Add. Case does not matter."
setting_factionids: "Whitelist factions"
setting_factionids_desc: "NPCs in any of these factions show carried gear even if their class is blacklisted. Faction IDs, e.g. \"fighters guild\". Factions in the same family count as one: adding \"imperial legion\" also covers Census and Excise, the East Empire Company, the Imperial Knights and their Tamriel Rebuilt counterparts."
setting_cellgroups: "Blacklist cell groups"
setting_cellgroups_desc: "NPCs inside matching cells show no carried gear, whatever their class or faction."
setting_cellids: "Blacklist cells"
setting_cellids_desc: "Cell names or IDs to blacklist. An entry matches any cell whose name or ID contains it, so \"vivec, temple\" covers one cell and \"tavern\" covers every cell with tavern in its name. Case does not matter."

